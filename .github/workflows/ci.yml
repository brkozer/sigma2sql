name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SIGMA2SQL_PG_DSN: postgresql://postgres:test@localhost:5432/postgres
      SIGMA2SQL_CH_URL: http://localhost:8123/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Run the DuckDB tests on the oldest version we support
        run: uv run --with "duckdb==1.3.0" pytest -q tests/test_duckdb.py tests/test_correlation.py tests/test_hunt.py
      - run: uv build
      - name: Convert and execute all SigmaHQ rules
        run: |
          git clone --depth 1 https://github.com/SigmaHQ/sigma.git /tmp/sigma
          git -C /tmp/sigma log -1 --format="SigmaHQ %h (%cs)"
          uv run python scripts/check_sigmahq.py /tmp/sigma/rules --dsn "$SIGMA2SQL_PG_DSN" --clickhouse "$SIGMA2SQL_CH_URL"
          uv run python scripts/check_sigmahq.py /tmp/sigma/rules --dsn "$SIGMA2SQL_PG_DSN" --clickhouse "$SIGMA2SQL_CH_URL" --profile ecs-winlogbeat
          uv run python scripts/check_sigmahq.py /tmp/sigma/rules --dsn "$SIGMA2SQL_PG_DSN" --clickhouse "$SIGMA2SQL_CH_URL" --profile evtx --samples /tmp/sigma --require-all
      - name: Convert and execute SigmaHQ's other rule folders
        run: |
          for folder in rules-emerging-threats rules-threat-hunting rules-compliance rules-placeholder; do
            echo "== $folder"
            uv run python scripts/check_sigmahq.py "/tmp/sigma/$folder" --dsn "$SIGMA2SQL_PG_DSN" --clickhouse "$SIGMA2SQL_CH_URL" --profile evtx --samples /tmp/sigma --placeholders any --require-all
          done
      - name: Convert and execute SigmaHQ's count() rules (kept in unsupported/ and deprecated/)
        run: |
          mkdir /tmp/agg
          grep -rlE 'condition:.*\| *count' --include=*.yml /tmp/sigma/unsupported /tmp/sigma/deprecated | xargs -I{} cp {} /tmp/agg/
          uv run python scripts/check_sigmahq.py /tmp/agg --dsn "$SIGMA2SQL_PG_DSN" --clickhouse "$SIGMA2SQL_CH_URL"
      - name: Run SigmaHQ regression samples (real events) through every rule
        run: uv run python scripts/check_regression.py /tmp/sigma --clickhouse "$SIGMA2SQL_CH_URL" --evtx
      - name: Compare with pySigma's SQLite backend on the same events
        run: uv run --with pysigma --with pysigma-backend-sqlite python scripts/diff_pysigma.py /tmp/sigma

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use this repository's action on the example rules
        uses: ./
        with:
          path: examples/rules
          require-tests: "true"
          sarif: rules.sarif
      - run: python -c "import json; assert json.load(open('rules.sarif'))['version'] == '2.1.0'"
