[project]
site_name = "sigma2sql"
site_description = "Sigma rules as SQL for SQLite, PostgreSQL, DuckDB and ClickHouse"
site_url = "https://brkozer.github.io/sigma2sql/"
repo_url = "https://github.com/brkozer/sigma2sql"
repo_name = "brkozer/sigma2sql"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed"
nav = [
  { "Home" = "index.md" },
  { "Quick start" = "quickstart.md" },
  { "Using sigma2sql" = [
    { "Hunt through log files" = "hunt.md" },
    { "Hunt in a database" = "database.md" },
    { "Convert rules" = "convert.md" },
    { "Correlations" = "correlations.md" },
    { "Placeholders" = "placeholders.md" },
    { "Filters" = "filters.md" },
    { "Profiles" = "profiles.md" },
    { "Test rules" = "testing.md" },
  ] },
  { "Reference" = [
    { "Supported features" = "features.md" },
    { "Command line" = "cli.md" },
    { "Library use" = "library.md" },
    { "How it works" = "how-it-works.md" },
  ] },
  { "How it is checked" = "correctness.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "navigation.indexes",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
