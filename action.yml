name: sigma2sql rule tests
description: Test Sigma rules against example events (<rule>.match.jsonl / <rule>.nomatch.jsonl) with sigma2sql
author: Ahmet Burak Özer
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Rule files or directories to check (space separated)
    default: rules
  profile:
    description: Built-in profile name or path to a profile YAML (field mapping, logsource conditions)
    default: ""
  require-tests:
    description: Fail when a rule has no .match.jsonl or .nomatch.jsonl file
    default: "false"
  python-version:
    description: Python used to run sigma2sql
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install sigma2sql
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check rules
      shell: bash
      env:
        RULE_PATHS: ${{ inputs.path }}
        PROFILE: ${{ inputs.profile }}
        REQUIRE_TESTS: ${{ inputs.require-tests }}
      run: |
        args=(check)
        read -ra paths <<< "$RULE_PATHS"
        args+=("${paths[@]}")
        if [ -n "$PROFILE" ]; then args+=(--profile "$PROFILE"); fi
        if [ "$REQUIRE_TESTS" = "true" ]; then args+=(--require-tests); fi
        sigma2sql "${args[@]}"
