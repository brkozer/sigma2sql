[project]
name = "sigma2sql"
version = "0.5.2"
description = "Sigma rules as SQL for SQLite, PostgreSQL, DuckDB and ClickHouse: convert, hunt through log files and test rules"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmet Burak Özer" }]
requires-python = ">=3.12"
keywords = ["sigma", "detection-engineering", "threat-hunting", "sql", "duckdb", "postgresql", "clickhouse", "evtx", "siem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0.2"]

[project.urls]
Homepage = "https://github.com/brkozer/sigma2sql"
Documentation = "https://brkozer.github.io/sigma2sql/"
Issues = "https://github.com/brkozer/sigma2sql/issues"
Changelog = "https://github.com/brkozer/sigma2sql/blob/main/CHANGELOG.md"

[project.optional-dependencies]
duckdb = ["duckdb>=1.3", "numpy>=2.0", "pytz"]
postgres = ["psycopg[binary]>=3.2.3"]
evtx = [
    "evtx>=0.8",
]

[project.scripts]
sigma2sql = "sigma2sql.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.3",
    "evtx>=0.8",
    "mypy>=2.4.1",
    "numpy>=2.0",
    "psycopg[binary]>=3.2.3",
    "pytest>=9.2.0",
    "rich>=14.0.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12",
]
# pinned exactly: zensical is pre-1.0
docs = ["zensical==0.0.74"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/sigma2sql", "scripts"]

[[tool.mypy.overrides]]
# pySigma is only installed on demand for scripts/diff_pysigma.py.
module = ["sigma.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma2sql"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs", "uv.lock", "action.yml"]
